
name: Build PHP on Windows (VC15)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build PHP ${{ matrix.php-version }} (${{ matrix.arch }}, ${{ matrix.ts }})
    runs-on: windows-2022 # Windows-2019 原生支持 VS2017 (VC15)
    
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4'] # 根据你的Fork分支调整，VC15主要支持PHP 7.2-7.4
        arch: [x64]          # 可选: x86, x64
        ts: [nts]            # 可选: ts (Thread Safe), nts (Non-Thread Safe)

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PHP
        uses: php/php-windows-builder/php@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          # 关键：指定使用 VC15 (VS2017) 工具链
          vs: '15'
          # 可选：添加额外的 configure 参数，例如启用特定扩展
          # configure-args: '--enable-cli --enable-cgi --with-openssl --with-zlib'
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php-version }}-${{ matrix.arch }}-${{ matrix.ts }}-vc15
          path: |
            php-sdk/phpdev/vc15/${{ matrix.arch }}/php-${{ matrix.php-version }}/Release${{ matrix.ts == 'ts' && '_TS' || '' }}/*.exe
            php-sdk/phpdev/vc15/${{ matrix.arch }}/php-${{ matrix.php-version }}/Release${{ matrix.ts == 'ts' && '_TS' || '' }}/*.dll
            php-sdk/phpdev/vc15/${{ matrix.arch }}/php-${{ matrix.php-version }}/Release${{ matrix.ts == 'ts' && '_TS' || '' }}/ext/
          retention-days: 5
