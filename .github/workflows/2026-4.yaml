name: Build PHP 7.4 on Windows (VC15)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022 # Windows-2019 默认包含 VS2017 (VC15)，最适合 PHP 7.4
    strategy:
      matrix:
        arch: [ x64 ] # 可选: x86, x64
        ts: [ ts ]    # 可选: ts (Thread Safe), nts (Non-Thread Safe)
    
    steps:
      - name: Checkout PHP Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 假设你的仓库就是 php-src，或者你需要在这里 clone php-src
          # 如果当前仓库不是 php-src，请取消下面注释并修改 url
          # repository: php/php-src
          # path: php-src

      - name: Setup PHP SDK Environment
        uses: php/setup-php-sdk@v0.7
        with:
          version: '7.4'
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          # 关键：指定使用 VC15 (VS2017)
          vs: '15' 

      - name: Install Dependencies
        run: |
          # 进入源码目录
          cd php-src
          # 更新依赖库 (deps)
          phpsdk_deps --update --branch PHP-7.4

      - name: Buildconf
        run: |
          cd php-src
          buildconf

      - name: Configure
        run: |
          cd php-src
          # 配置编译选项，启用 CLI 和常用扩展
          configure --enable-cli --enable-cgi --with-openssl --with-zlib --enable-mbstring --enable-pdo --with-pdo-sqlite --with-sqlite3 --enable-debug-pack=no

      - name: Compile
        run: |
          cd php-src
          nmake

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-7.4-${{ matrix.arch }}-${{ matrix.ts }}-vc15
          path: |
            php-src/x64/Release_TS/php.exe
            php-src/x64/Release_TS/php-cgi.exe
            php-src/x64/Release_TS/php7.dll
            php-src/x64/Release_TS/ext/
          retention-days: 5
